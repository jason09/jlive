name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run types:chain
      - run: git diff --exit-code -- src/chain.generated.d.ts
      - run: npm run check
      - run: npm run pack:check
