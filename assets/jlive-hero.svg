<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">jLive Project Banner</title>
  <desc id="desc">Banner for jLive with updated logo mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.16">
    <circle cx="1030" cy="120" r="210" fill="#22d3ee"/>
    <circle cx="220" cy="530" r="220" fill="#34d399"/>
    <circle cx="760" cy="490" r="160" fill="#38bdf8"/>
  </g>

  <g id="logoMark">
    <rect x="-88" y="-88" width="176" height="176" rx="34" fill="#0b1220" stroke="url(#stroke)" stroke-width="6"/>

    <path d="M-34 -36 L-58 0 L-34 36" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 -36 L58 0 L34 36" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M-8 -42 V20 C-8 36 -18 44 -30 44" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 -42 V44 H44" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(80 108)">
    <rect x="0" y="0" width="330" height="330" rx="36" fill="#0b1220" stroke="url(#stroke)" stroke-width="4"/>
    <g transform="translate(165 112)">
      <use href="#logoMark"/>
    </g>
    <text x="44" y="218" fill="#e2e8f0" font-family="'Segoe UI', Tahoma, sans-serif" font-size="52" font-weight="700">jLive</text>
    <text x="44" y="258" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="26">PHP-like for Node.js</text>
    <path d="M44 284 L286 284" stroke="url(#stroke)" stroke-width="4" stroke-linecap="round"/>
    <text x="44" y="316" fill="#cbd5e1" font-family="'Consolas', 'Courier New', monospace" font-size="22">chain(value).trim()</text>
  </g>

  <g transform="translate(460 124)">
    <g transform="translate(-62 -12) scale(0.48)">
      <use href="#logoMark"/>
    </g>

    <text x="0" y="0" fill="#f8fafc" font-family="'Segoe UI', Tahoma, sans-serif" font-size="74" font-weight="700">jLive</text>
    <text x="0" y="62" fill="#cbd5e1" font-family="'Segoe UI', Tahoma, sans-serif" font-size="32">PHP-Compatible Helpers for Node.js</text>

    <g transform="translate(0 120)">
      <rect x="0" y="0" width="650" height="58" rx="12" fill="#0b1220" stroke="#334155"/>
      <text x="20" y="38" fill="#e2e8f0" font-family="'Consolas', 'Courier New', monospace" font-size="24">import { PHP, chain } from "jlive";</text>
    </g>

    <g transform="translate(0 194)">
      <rect x="0" y="0" width="650" height="58" rx="12" fill="#0b1220" stroke="#334155"/>
      <text x="20" y="38" fill="#e2e8f0" font-family="'Consolas', 'Courier New', monospace" font-size="24">PHP.String.strtoupper("hello") // HELLO</text>
    </g>

    <g transform="translate(0 268)">
      <rect x="0" y="0" width="650" height="58" rx="12" fill="#0b1220" stroke="#334155"/>
      <text x="20" y="38" fill="#e2e8f0" font-family="'Consolas', 'Courier New', monospace" font-size="24">chain(" hi ").trim().pipe(v =&gt; v.toUpperCase())</text>
    </g>
  </g>
</svg>
