<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">jLive Banner</title>
  <desc id="desc">Promotional banner for jLive, a PHP-like helper library for modern Node.js.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#14263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#101d30"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.7" filter="url(#blur)">
    <circle cx="178" cy="112" r="118" fill="#22d3ee"/>
    <circle cx="1010" cy="126" r="160" fill="#34d399"/>
    <circle cx="950" cy="514" r="170" fill="#0ea5e9"/>
    <circle cx="290" cy="548" r="140" fill="#10b981"/>
  </g>

  <g opacity="0.08">
    <path d="M0 520 C190 450 284 464 446 520 C616 580 784 572 1200 428 L1200 630 L0 630 Z" fill="#e2e8f0"/>
    <path d="M0 126 C210 170 346 164 524 124 C708 82 926 70 1200 148" fill="none" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g transform="translate(74 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="338" height="458" rx="34" fill="url(#card)" stroke="url(#accent)" stroke-width="3"/>

    <g transform="translate(170 124)">
      <rect x="-88" y="-88" width="176" height="176" rx="34" fill="#07111f" stroke="url(#accent)" stroke-width="6"/>
      <path d="M-34 -36 L-58 0 L-34 36" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 -36 L58 0 L34 36" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-8 -42 V20 C-8 36 -18 44 -30 44" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 -42 V44 H44" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="44" y="286" fill="#f8fafc" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="58" font-weight="800" letter-spacing="-1">jLive</text>
    <text x="44" y="326" fill="#cbd5e1" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="23" font-weight="600">PHP-like helpers</text>
    <text x="44" y="354" fill="#cbd5e1" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="23" font-weight="600">for modern Node.js</text>

    <rect x="44" y="392" width="248" height="42" rx="21" fill="#091423" stroke="#22344a"/>
    <circle cx="70" cy="413" r="7" fill="#34d399"/>
    <text x="88" y="420" fill="#e2e8f0" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="18" font-weight="700">ESM + TypeScript + Chain API</text>
  </g>

  <g transform="translate(458 94)">
    <text x="0" y="0" fill="#7dd3fc" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="20" font-weight="700" letter-spacing="2">PHP COMPATIBILITY LAYER</text>
    <text x="0" y="88" fill="#f8fafc" font-family="'Avenir Next Condensed', 'Trebuchet MS', sans-serif" font-size="84" font-weight="800" letter-spacing="-2">Write Node.js</text>
    <text x="0" y="166" fill="#f8fafc" font-family="'Avenir Next Condensed', 'Trebuchet MS', sans-serif" font-size="84" font-weight="800" letter-spacing="-2">without losing</text>
    <text x="0" y="244" fill="url(#accent)" font-family="'Avenir Next Condensed', 'Trebuchet MS', sans-serif" font-size="84" font-weight="800" letter-spacing="-2">PHP instincts</text>

    <text x="0" y="296" fill="#cbd5e1" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="28">String, array, crypto, network, cookie, session, and chainable helpers</text>

    <g transform="translate(0 352)" filter="url(#shadow)">
      <rect x="0" y="0" width="640" height="132" rx="26" fill="#08101d" stroke="#1e3348"/>
      <circle cx="34" cy="32" r="7" fill="#fb7185"/>
      <circle cx="58" cy="32" r="7" fill="#f59e0b"/>
      <circle cx="82" cy="32" r="7" fill="#34d399"/>
      <text x="112" y="39" fill="#7dd3fc" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="18">example.js</text>

      <text x="28" y="78" fill="#a5f3fc" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="24">chain("  hello world  ").trim()</text>
      <text x="28" y="108" fill="#86efac" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="24">  .str_replace("world", "jLive").strtoupper()</text>
    </g>
  </g>
</svg>
